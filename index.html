<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR Natal FGBMFI</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 2px 10px #ccc;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>🎄 Scanner QR Natal FGBMFI</h2>

  <p>Arahkan kamera ke QR peserta</p>

  <div id="reader"></div>

  <div id="hasil">Menyiapkan kamera...</div>

</div>

<script>

const CHECKIN_URL =
"https://script.google.com/macros/s/AKfycbwAZ-pLE9tjAKeXM5npRM1vpaFVNnK8UlS6Pc5oEXlFD_UYXk4xl9HxAb4NIGOdZFBwGw/exec";

let sudahScan = false;


function onScanSuccess(decodedText) {

  if (sudahScan) return;

  sudahScan = true;

  const hasilScan = decodedText.trim();
  let id = hasilScan;

  // Jika QR berisi URL lengkap, ambil ID dari parameter scan
  try {
    const url = new URL(hasilScan);
    id = url.searchParams.get("scan") || hasilScan;
  } catch (e) {
    // Jika QR hanya berisi ID, gunakan langsung
  }

  document.getElementById("hasil").textContent =
    "⏳ Memproses " + id + "...";

  window.location.href =
    CHECKIN_URL + "?scan=" + encodeURIComponent(id);
}

function onScanFailure(error) {
  // scanner terus berjalan
}

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: { width: 250, height: 250 }
  },
  false
);

scanner.render(onScanSuccess, onScanFailure);

</script>

</body>
</html>
